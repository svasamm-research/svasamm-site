events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Keep the UAT/staging host out of search indexes. The same image serves prod and
    # uat, so we key off the Host: only uat.svasamm.com gets X-Robots-Tag: noindex.
    # (nginx omits an add_header whose value is empty, so prod sends no such header.)
    map $host $robots_tag {
        default          "";
        uat.svasamm.com  "noindex, nofollow";
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Emit RELATIVE Location headers. Behind Traefik's TLS termination nginx sees
        # plain HTTP, so it would otherwise build absolute redirects as
        # `http://host/path` — making every legacy-URL 301 an extra hop
        # (301 -> http -> HSTS -> https) with an insecure link in the chain.
        # Relative Location lets the browser resolve against the original https origin.
        absolute_redirect off;

        # Canonical host: www.svasamm.com -> svasamm.com (301, path preserved).
        # Done in nginx, not a Traefik middleware — Traefik forwards the original Host
        # header, so this is reliable without router-name guessing (the Traefik-label
        # route didn't apply; same lesson as lucoze).
        if ($host = www.svasamm.com) {
            return 301 https://svasamm.com$request_uri;
        }

        # Security headers (applied to every response). NOTE: an `add_header` inside a
        # `location` cancels ALL inherited add_headers, so the cache locations below use
        # `expires` only (which sets Cache-Control without triggering that reset).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        # HSTS in nginx (not Traefik — the middleware route didn't apply). No
        # includeSubDomains/preload yet: add once every subdomain (incl. uat) is HTTPS-only.
        add_header Strict-Transport-Security "max-age=31536000" always;
        # noindex on the UAT host only (empty -> header omitted on prod). See the map above.
        add_header X-Robots-Tag $robots_tag always;

        # Cache static assets (expires-only; no add_header so security headers inherit)
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|pdf|txt|xml)$ {
            expires 1y;
            access_log off;
        }

        # Cache HTML with shorter duration (expires-only; security headers inherit).
        # Needs the same try_files as location / below: Next's static export emits, per
        # page route, both a directory (RSC prefetch payload) and the real file at
        # $uri.html (e.g. pages/millingo.html/ + pages/millingo.html.html) — since this
        # regex location outranks the prefix `location /` for any .html request, without
        # try_files here nginx's default handler hits the directory and 301s to add a
        # trailing slash instead of serving the page.
        location ~* \.(html|htm)$ {
            expires 1h;
            try_files $uri.html $uri $uri/ =404;
        }

        # NOTE: /index.html is NOT 301'd to / here — combined with `index index.html`
        # that creates an internal redirect loop on `/`. The canonical <link> tags
        # (all point to https://svasamm.com/...) handle the /index.html dedup for SEO.

        # Static site: serve real files, return a real 404 for anything unmatched.
        # (Previously fell through to /index.html, which made every unknown URL a
        # soft-404 duplicate of the homepage — an infinite crawl trap.)
        # Redesign URL moves / removed pages — preserve link equity from indexed URLs.
        location = /pages/privacy.html          { return 301 /privacy; }
        location = /pages/terms-of-service.html { return 301 /terms; }
        location = /pages/testimonials.html     { return 301 /; }
        location = /pages/hims.html             { return 301 https://lucoze.com/; }
        # Loan Management dropped from the product line (handoff-2) — send to Solutions.
        location = /pages/loan-management.html  { return 301 /pages/services.html; }

        location / {
            try_files $uri.html $uri $uri/ =404;
        }

        # Branded 404 page (served with a real 404 status)
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}