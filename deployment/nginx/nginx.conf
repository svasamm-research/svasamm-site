events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Security headers (HSTS is set at the Traefik edge, not here, to avoid a
        # duplicate Strict-Transport-Security header).
        # NOTE: an `add_header` inside a `location` block cancels ALL inherited
        # add_headers. The cache locations below therefore use ONLY `expires`
        # (which sets Cache-Control without triggering that reset) so these
        # security headers apply to every response, including HTML.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

        # Cache static assets (expires-only; no add_header so security headers inherit)
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|pdf|txt|xml)$ {
            expires 1y;
            access_log off;
        }

        # Cache HTML with shorter duration (expires-only; security headers inherit)
        location ~* \.(html|htm)$ {
            expires 1h;
        }

        # NOTE: /index.html is NOT 301'd to / here — combined with `index index.html`
        # that creates an internal redirect loop on `/`. The canonical <link> tags
        # (all point to https://svasamm.com/...) handle the /index.html dedup for SEO.

        # Static site: serve real files, return a real 404 for anything unmatched.
        # (Previously fell through to /index.html, which made every unknown URL a
        # soft-404 duplicate of the homepage — an infinite crawl trap.)
        location / {
            try_files $uri $uri/ =404;
        }

        # Branded 404 page (served with a real 404 status)
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}