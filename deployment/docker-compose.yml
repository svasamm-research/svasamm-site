# PRODUCTION compose (svasamm.com). UAT: docker-compose.uat.yml.
# Dokploy pulls the Docker Hub image and runs this. Domain + HTTPS (Let's Encrypt) are set
# in the Dokploy **Domains** tab; www->apex + HSTS are middleware labels — see
# deployment/dokploy-seo.md. Image is built/pushed by .github/workflows/deploy.yml.
services:
  svasamm-website:
    image: ${CUSTOM_IMAGE:-svasamm/svasamm-website}:${CUSTOM_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    ports:
      - mode: ingress
        host_ip: ${AGENT_PRIVATE_IP}
        target: 80
        published: "${BENCH_PORT}"
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
