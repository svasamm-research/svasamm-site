# Docker image build & publish for the Svasamm marketing website.
#
# TRIGGER: a published GitHub Release in this repo (or manual workflow_dispatch).
#   uat-vX.Y.Z  ->  UAT build   -> svasamm/svasamm-website:uat-vX.Y.Z + :uat-latest  -> UAT deploy
#   vX.Y.Z      ->  Prod build  -> svasamm/svasamm-website:vX.Y.Z + :latest           -> Production deploy
#
# Version convention: use the SAME number for a release across environments — validate
# on UAT as `uat-v0.0.5`, then release the same code to prod as `v0.0.5`.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME                  Docker Hub username
#   DOCKERHUB_TOKEN                     Docker Hub access token (read+write)
#   DOKPLOY_SVASAMM_WEBSITE_UAT_WEBHOOK Dokploy deploy webhook (UAT app)
#   DOKPLOY_SVASAMM_WEBSITE_WEBHOOK     Dokploy deploy webhook (production app)
# Required GitHub Variables:
#   DOKPLOY_DEPLOY_ENABLED             set to "true" to enable auto-deploy after build

name: Build & Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. uat-v0.0.5 or v0.0.5). Defaults to 'uat-latest' for manual rebuilds."
        required: false
        default: "uat-latest"
        type: string

env:
  IMAGE: svasamm/svasamm-website

jobs:
  test:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test   # html-validate + stylelint

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      is_uat: ${{ steps.meta.outputs.is_uat }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and environment
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$INPUT_VERSION}"
          if echo "$VERSION" | grep -q "^uat-"; then
            FLOATING_TAG="uat-latest"; IS_UAT="true"
          else
            FLOATING_TAG="latest"; IS_UAT="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "floating_tag=${FLOATING_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_uat=${IS_UAT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.floating_tag }}
          cache-from: type=gha,key=svasamm-website-${{ steps.meta.outputs.floating_tag }}
          cache-to: type=gha,mode=max,key=svasamm-website-${{ steps.meta.outputs.floating_tag }}

  deploy-uat:
    name: Deploy to UAT
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.is_uat == 'true' && vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: uat
    steps:
      - name: Trigger Dokploy redeploy (UAT)
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_SVASAMM_WEBSITE_UAT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "UAT webhook not set — skipping."; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          echo "Webhook HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.is_uat == 'false' && vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Trigger Dokploy redeploy (Production)
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_SVASAMM_WEBSITE_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "Production webhook not set — skipping."; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          echo "Webhook HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]
