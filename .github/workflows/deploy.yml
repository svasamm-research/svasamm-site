name: Build & Deploy (tag-based)

# Deploys ONLY on release tags — pushing to branches never deploys.
#   uat-v*  (cut from the `uat` branch)  -> UAT  (uat.svasamm.com)
#   v*      (cut from the `main` branch) -> PROD (svasamm.com)
# Builds/pushes the image to GHCR, then triggers the matching Dokploy webhook, which
# pulls the new tag and redeploys. See docs/deployment.md.
on:
  push:
    tags:
      - 'v*'
      - 'uat-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # svasamm-research/svasamm-site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Validate (html-validate + stylelint)
        run: yarn test

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Always tag with the git tag; also move a rolling env tag that Dokploy pulls.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=uat-latest,enable=${{ startsWith(github.ref, 'refs/tags/uat-v') }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Trigger the matching Dokploy app to pull the new image and redeploy ---
      # Webhook URLs are secrets, passed via env (not interpolated into the command).
      - name: Deploy to UAT
        if: startsWith(github.ref, 'refs/tags/uat-v')
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_UAT_WEBHOOK }}
        run: curl -fsS -X POST "$WEBHOOK"

      - name: Deploy to Production
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_PROD_WEBHOOK }}
        run: curl -fsS -X POST "$WEBHOOK"
