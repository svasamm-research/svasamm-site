name: Linters

# Commit messages follow Conventional Commits from 18 Nov 2026, as on lucoze.com. Checked on PRs into
# develop only: a promotion PR (develop → uat → main) carries older commits written before the rule.
on:
  pull_request:
    branches: [develop]

jobs:
  commitlint:
    name: Semantic Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21
      - run: npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
