<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="svasamm.css">
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
  <script src="icons.js"></script>
  <style>
    .svh-nav { color: var(--sv-ink-2); font-size: 15px; font-weight: 500; transition: color .15s ease; }
    .svh-nav:hover { color: var(--sv-ink); }
    .svh-item { border-radius: var(--sv-r-sm); transition: background .15s ease; }
    .svh-item:hover { background: var(--sv-bg-subtle); }
    @media (max-width: 940px) { .svh-desk { display: none !important; } }
    @media (min-width: 941px) { .svh-mob { display: none !important; } }
  </style>
</helmet>
<header style="position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--sv-line)">
  <div class="sv-wrap" style="display:flex;align-items:center;gap:26px;height:68px">
    <a href="Svasamm.dc.html" style="display:flex;align-items:center;gap:10px;color:var(--sv-ink)">
      <img src="src/images/logo-svasamm.svg" alt="Svasamm" width="32" height="32" style="width:32px;height:32px;border-radius:7px">
      <span style="font-weight:600;font-size:20px;letter-spacing:-.02em">Svasamm</span>
    </a>

    <nav class="svh-desk" style="display:flex;align-items:center;gap:26px;margin-left:10px">
      <div style="position:relative" onMouseEnter="{{ openMega }}" onMouseLeave="{{ closeMega }}">
        <button onClick="{{ toggleMega }}" class="svh-nav" aria-expanded="{{ mega }}" aria-haspopup="true" aria-controls="svh-mega" style="display:inline-flex;align-items:center;gap:5px;background:none;border:0;cursor:pointer;font-family:var(--sv-font);padding:10px 0;color:{{ solColor }}">
          Solutions <span class="sv-ic" data-icon="chevron-down" style="width:15px;height:15px"></span>
        </button>
        <sc-if value="{{ mega }}" hint-placeholder-val="{{ false }}">
          <div class="sv-card" id="svh-mega" style="position:absolute;top:calc(100% + 12px);left:-18px;width:680px;padding:10px;box-shadow:var(--sv-sh-3);display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div style="padding:12px">
              <div class="sv-eyebrow" style="margin-bottom:10px">Vertical products</div>
              <div style="display:flex;flex-direction:column;gap:2px">
                <sc-for list="{{ vertical }}" as="p" hint-placeholder-count="3">
                  <a href="{{ p.href }}" target="{{ p.target }}" class="svh-item" style="display:flex;gap:12px;padding:11px;color:var(--sv-ink)">
                    <span class="sv-chip sv-chip-sm"><span class="sv-ic" data-icon="{{ p.icon }}" style="width:18px;height:18px"></span></span>
                    <span style="display:block">
                      <span style="display:block;font-weight:600;font-size:15px;line-height:1.3">{{ p.name }}</span>
                      <span style="display:block;font-size:13px;color:var(--sv-ink-3);line-height:1.4">{{ p.short }}</span>
                    </span>
                  </a>
                </sc-for>
              </div>
            </div>
            <div style="padding:12px;background:var(--sv-bg-subtle);border-radius:var(--sv-r)">
              <div class="sv-eyebrow" style="margin-bottom:10px">Platform modules</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px">
                <sc-for list="{{ platform }}" as="p" hint-placeholder-count="4">
                  <a href="{{ p.href }}" class="svh-item" style="display:flex;align-items:center;gap:9px;padding:9px 10px;color:var(--sv-ink);font-size:14px">
                    <span class="sv-ic" data-icon="{{ p.icon }}" style="width:17px;height:17px;color:var(--sv-brand)"></span>{{ p.name }}
                  </a>
                </sc-for>
              </div>
              <a href="Solutions.dc.html" style="display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding-left:10px;font-size:14px;font-weight:500;color:var(--sv-brand)">View all solutions <span class="sv-ic" data-icon="arrow-right" style="width:15px;height:15px"></span></a>
            </div>
          </div>
        </sc-if>
      </div>
      <a href="Svasamm.dc.html#regions" class="svh-nav">Regions</a>
      <a href="Svasamm.dc.html#why" class="svh-nav">Why Svasamm</a>
      <a href="Contact.dc.html" class="svh-nav" style="color:{{ contactColor }}">Contact</a>
    </nav>

    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <a href="Contact.dc.html" class="sv-btn sv-btn-secondary svh-desk" style="font-size:14px;padding:10px 15px">Book a walkthrough</a>
      <a href="Contact.dc.html" class="sv-btn sv-btn-primary svh-desk" style="font-size:14px;padding:10px 16px">Talk to us</a>
      <button class="svh-mob" onClick="{{ toggleMobile }}" aria-label="Menu" aria-expanded="{{ mobile }}" aria-controls="svh-mobile-menu" style="background:none;border:1px solid var(--sv-line-strong);border-radius:var(--sv-r-sm);color:var(--sv-ink);cursor:pointer;display:grid;place-items:center;width:42px;height:42px">
        <span class="sv-ic" data-icon="{{ mobileIcon }}" style="width:20px;height:20px"></span>
      </button>
    </div>
  </div>

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <div class="svh-mob" id="svh-mobile-menu" style="border-top:1px solid var(--sv-line);background:var(--sv-bg);padding:16px 24px 24px">
      <div class="sv-eyebrow">Products</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ all }}" as="p" hint-placeholder-count="7">
          <a href="{{ p.href }}" target="{{ p.target }}" class="svh-item" style="display:flex;align-items:center;gap:12px;padding:12px 10px;color:var(--sv-ink);font-size:16px">
            <span class="sv-ic" data-icon="{{ p.icon }}" style="width:19px;height:19px;color:var(--sv-brand)"></span>{{ p.name }}
          </a>
        </sc-for>
      </div>
      <hr class="sv-hairline" style="margin:14px 0">
      <div style="display:flex;flex-direction:column;gap:2px">
        <a href="Solutions.dc.html" class="svh-item" style="padding:12px 10px;color:var(--sv-ink);font-size:16px">All solutions</a>
        <a href="Svasamm.dc.html#regions" class="svh-item" style="padding:12px 10px;color:var(--sv-ink);font-size:16px">Regions</a>
        <a href="Svasamm.dc.html#why" class="svh-item" style="padding:12px 10px;color:var(--sv-ink);font-size:16px">Why Svasamm</a>
      </div>
      <a href="Contact.dc.html" class="sv-btn sv-btn-primary sv-btn-block" style="margin-top:14px">Talk to us</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:68},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;solutions&quot;,&quot;products&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mega: false, mobile: false };
  componentDidMount() { window.svIcons && window.svIcons(); }
  componentDidUpdate() { window.svIcons && window.svIcons(); }
  renderVals() {
    const active = this.props.active || '';
    const vertical = [
      { name:'Millingo', short:'Rice-mill ERP', icon:'wheat', href:'Millingo.dc.html', target:'' },
      { name:'Lucoze', short:'Healthcare HIMS', icon:'heart-pulse', href:'https://lucoze.com', target:'_blank' },
      { name:'DMS', short:'Distributor management', icon:'truck', href:'DMS.dc.html', target:'' },
    ];
    const platform = [
      { name:'ERP System', icon:'layers', href:'ERP.dc.html' },
      { name:'HRMS', icon:'users', href:'HRMS.dc.html' },
      { name:'CRM Platform', icon:'handshake', href:'CRM.dc.html' },
      { name:'Service Desk', icon:'headset', href:'ServiceDesk.dc.html' },
    ];
    return {
      vertical, platform,
      all: [...vertical, ...platform.map(p=>({...p,target:''}))],
      mega: this.state.mega, mobile: this.state.mobile,
      openMega: ()=>this.setState({mega:true}), closeMega: ()=>this.setState({mega:false}),
      toggleMega: (e)=>{ e&&e.preventDefault(); this.setState({mega:!this.state.mega}); },
      solColor: (this.state.mega || active==='solutions' || active==='products') ? 'var(--sv-ink)' : 'var(--sv-ink-2)',
      contactColor: active==='contact' ? 'var(--sv-ink)' : 'var(--sv-ink-2)',
      toggleMobile: ()=>this.setState({mobile:!this.state.mobile}),
      mobileIcon: this.state.mobile ? 'x' : 'menu',
    };
  }
}
</script>
</body>
</html>
