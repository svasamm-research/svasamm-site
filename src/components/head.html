<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@@title</title>
<meta name="description" content="@@description">
<link rel="canonical" href="@@canonical">

<link rel="stylesheet" href="/styles/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/32.png">
<link rel="apple-touch-icon" href="/images/favicon/108.png">
<link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">

<!-- Open Graph / Social -->
<meta property="og:site_name" content="Svasamm">
<meta property="og:type" content="@@ogType">
<meta property="og:title" content="@@title">
<meta property="og:description" content="@@description">
<meta property="og:url" content="@@canonical">
<meta property="og:image" content="https://svasamm.com/images/hero-dashboard.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="@@title">
<meta name="twitter:description" content="@@description">
<meta name="twitter:image" content="https://svasamm.com/images/hero-dashboard.jpg">
