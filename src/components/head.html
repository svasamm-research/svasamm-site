<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@@title</title>
<meta name="description" content="@@description">
<link rel="canonical" href="@@canonical">

<!-- Google Analytics 4. Set GA_ID to your Measurement ID (e.g. 'G-XXXXXXXXXX') to enable.
     Empty = analytics OFF (no script loaded, no cookies). -->
<script>
  window.GA_ID = '';
  if (window.GA_ID) {
    var _ga = document.createElement('script');
    _ga.async = true;
    _ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_ID;
    document.head.appendChild(_ga);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', window.GA_ID);
  }
</script>

<link rel="stylesheet" href="/styles/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="/images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/180.png">

<!-- Open Graph / Social -->
<meta property="og:site_name" content="Svasamm">
<meta property="og:type" content="@@ogType">
<meta property="og:title" content="@@title">
<meta property="og:description" content="@@description">
<meta property="og:url" content="@@canonical">
<meta property="og:image" content="https://svasamm.com/images/hero-dashboard.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="@@title">
<meta name="twitter:description" content="@@description">
<meta name="twitter:image" content="https://svasamm.com/images/hero-dashboard.jpg">
